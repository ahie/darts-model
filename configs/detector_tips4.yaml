# Fine-tune of the stride-8 detector with a stride-4 tip heatmap
# (model/tips.py), whose peaks the Hough readout's darts are given one-to-one
# by the Hungarian algorithm.
#
#   darts-train --config configs/detector_tips4.yaml
#
# The heatmap places a landing point to ~1.3-1.8px where it has a peak, the
# dense regression ~2px at best. Hough still counts the darts and places each
# roughly; each then takes a distinct peak, within the validation gate, or
# keeps its estimate. A throw's score depends only on the set of landing
# points, so in a tight group it is enough that every dart gets a distinct
# tip. Starts from every weight of a finished configs/detector.yaml run; the
# tip head is the only freshly initialised part. Checkpoints rank on the
# assigned readout; plain Hough on the same weights is logged alongside, as
# val/landing_px_error_penalised_centre_claim_unsnapped.
#
# Outputs, per stride-8 cell: a dart foreground score and that dart's oriented
# box, landing point and flight end; plus the 40 double-ring corners of the
# board. Darts are read out by Hough voting over the foreground cells.
#
# On one RTX 5090: ~6 min per epoch, about 6 hours for 60.

backbone:
  backbone_widths: [96, 128, 160, 256]
  backbone_depths: [2, 2, 6, 2]
  backbone_dilate_last: false
  backbone_drop_path: 0.1
  backbone_weights: ""
  # The finished stride-8 run; init_weights loads every weight but no
  # optimiser or schedule state.
  init_weights: "outputs/detector/checkpoints/epoch768-4.055.ckpt"
  backbone_freeze_epochs: 0

head:
  out_stride: 8
  head_width: 128
  head_depth: 2
  use_pan: true
  predict_ends: true
  predict_keypoints: true
  num_keypoints: 40
  kp_head_width: 64
  kp_head_depth: 2
  predict_tip_heatmap: true
  # Stride 4: the head reads the backbone's stride-4 stage, fused with the
  # neck upsampled 2x. 32 wide there costs ~1.2 GMAC.
  tip_stride: 4
  tip_head_width: 32
  tip_head_depth: 2

loss:
  focal_alpha: 2.0
  focal_gamma: 4.0
  fg_weight: 1.0
  centre_weight: 5.0
  dir_weight: 0.75
  size_weight: 0.4
  tip_weight: 5.0
  flight_weight: 2.5
  kp_weight: 1.0
  kp_offset_weight: 1.0
  kp_sigma: 2.0
  # One stride-4 cell, 4px.
  tip_sigma: 1.0
  # The offset is trained on the 3x3 cells around each tip, so a peak one
  # cell off still points at it, weighted by the heatmap target so the tip's
  # own cell keeps most of the loss.
  tip_offset_radius: 1
  tip_offset_weighting: "gaussian"
  tip_heat_weight: 1.0
  tip_offset_weight: 1.0

readout:
  vote_bin_px: 4.0
  fg_threshold: 0.5
  peak_min_votes: 8
  # Validation matches detections to darts one-to-one within this distance
  # (landing point, pixels at the input size).
  match_gate_px: 40.0
  # Darts are given peaks scoring at least tip_snap_score one-to-one, never
  # further than tip_assign_gate_px -- the validation match gate.
  tip_snap: true
  tip_assign: "hungarian"
  tip_assign_gate_px: 40.0
  tip_snap_score: 0.3
  tip_snap_px: 8.0
  tip_snap_axis_px: 4.0
  tip_peak_count: 16

training:
  # A fine-tune of converged weights; the fresh tip head trains at 10x, and
  # for the first epochs reads the neck detached so its uninformed early
  # gradients cannot move the rest of the model.
  lr: 2.0e-5
  readout_lr_factor: 10.0
  readout_warmup_epochs: 5
  backbone_lr_factor: 0.1
  weight_decay: 0.05
  warmup_epochs: 3
  final_lr_factor: 0.01
  warmup_beta1: 0.8
  # Cosine over max_epochs; it cannot be lengthened by resuming.
  max_epochs: 60
  gradient_clip_val: 0.5
  batch_size: 16
  accumulate_grad_batches: 4
  precision: "bf16-mixed"
  num_workers: 4
  accelerator: "gpu"
  devices: 1

data:
  image_size: 1024
  # Real photographs behind the board: scripts/download_places365.py.
  bg_image_dir: "bg_images"
  # CUDA devices to render on. Empty renders on the training GPU; e.g. [1]
  # moves rendering to a second GPU.
  render_gpus: []
  epoch_length: 10000
  val_epoch_length: 1000
  # P(0, 1, 2, 3 darts)
  dart_count_weights: [0.05, 0.25, 0.30, 0.40]
  grouping_prob: 0.55
  tight_prob: 0.55
  augmentation:
    brightness_limit: 0.4
    contrast_limit: 0.4
    # albumentations HueSaturationValue on uint8, OpenCV units: hue in
    # half-degrees (30 = +-60 degrees), saturation and value on 0-255.
    hue_shift_limit: 30
    sat_shift_limit: 30
    val_shift_limit: 20
    gaussian_blur: true
    random_erasing: false
    # Shot, Gaussian and ISO sensor noise, applied on the GPU by GPUAugment.
    sensor_noise: true
    shot_noise_p: 0.2
    gauss_noise_p: 0.8
    iso_noise_p: 0.6

experiment:
  name: "detector_tips4"
  output_dir: "outputs"
  seed: 42
  log_every_n_steps: 50
  # Mean landing error over every ground-truth dart, a missed dart counting
  # as match_gate_px; logged every validation epoch. On the snapped readout.
  checkpoint_monitor: "val/landing_px_error_penalised"
