# The detector at output stride 4: configs/detector.yaml with the neck and
# heads one level finer. Same backbone (stride-4 pretraining serves both), seed
# and validation frames, so the two runs differ only in the output grid.
#
#   darts-train --config configs/detector_stride4.yaml
#
# Why: a dart covers ~4x as many cells, more of them near the tip, and the
# grid reads from the backbone's widest stage. 73.9 GMAC at 1024 against
# 36.8 at stride 8 -- the neck and head cost 4x; the backbone is unchanged.

backbone:
  backbone_widths: [96, 128, 160, 256]
  backbone_depths: [2, 2, 6, 2]
  backbone_dilate_last: false
  backbone_drop_path: 0.1
  # Written by darts-promote-backbone after stage 1.
  backbone_weights: "outputs/backbone.ckpt"
  init_weights: ""
  # Frozen while the randomly initialised head converges against fixed
  # features, then adapted at backbone_lr_factor.
  backbone_freeze_epochs: 50
  # After the unfreeze the backbone's learning rate ramps from 0 to its
  # scheduled value over this many epochs, so it does not join at full rate
  # with fresh optimiser moments.
  backbone_rewarmup_epochs: 5

head:
  out_stride: 4
  head_width: 128
  head_depth: 2
  use_pan: true
  predict_ends: true
  predict_keypoints: true
  num_keypoints: 40
  kp_head_width: 64
  kp_head_depth: 2

loss:
  focal_alpha: 2.0
  focal_gamma: 4.0
  fg_weight: 1.0
  centre_weight: 5.0
  dir_weight: 0.75
  size_weight: 0.4
  tip_weight: 5.0
  flight_weight: 2.5
  kp_weight: 1.0
  kp_offset_weight: 1.0
  kp_sigma: 2.0

readout:
  vote_bin_px: 4.0
  fg_threshold: 0.5
  # Scaled with the number of cells per dart (4x stride 8's 8), so a peak
  # needs the same share of a dart's cells to count.
  peak_min_votes: 32
  # Validation matches detections to darts one-to-one within this distance
  # (landing point, pixels at the input size).
  match_gate_px: 40.0

training:
  lr: 5.0e-4
  backbone_lr_factor: 0.1
  weight_decay: 0.05
  warmup_epochs: 10
  final_lr_factor: 0.01
  warmup_beta1: 0.8
  # Cosine over max_epochs; it cannot be lengthened by resuming.
  max_epochs: 800
  gradient_clip_val: 0.5
  # Same effective batch (64) and steps per epoch as stride 8, in half-size
  # micro-batches: the stride-4 neck and heads need ~30% more activation
  # memory per image. Only GroupNorm and LayerNorm, so batch size does not
  # change normalisation.
  batch_size: 8
  accumulate_grad_batches: 8
  precision: "bf16-mixed"
  num_workers: 4
  accelerator: "gpu"
  devices: 1

data:
  image_size: 1024
  # Real photographs behind the board: scripts/download_places365.py.
  bg_image_dir: "bg_images"
  # CUDA devices to render on. Empty renders on the training GPU; e.g. [1]
  # moves rendering to a second GPU.
  render_gpus: []
  epoch_length: 10000
  val_epoch_length: 1000
  # P(0, 1, 2, 3 darts)
  dart_count_weights: [0.05, 0.25, 0.30, 0.40]
  grouping_prob: 0.55
  tight_prob: 0.55
  augmentation:
    brightness_limit: 0.4
    contrast_limit: 0.4
    # albumentations HueSaturationValue on uint8, OpenCV units: hue in
    # half-degrees (30 = +-60 degrees), saturation and value on 0-255.
    hue_shift_limit: 30
    sat_shift_limit: 30
    val_shift_limit: 20
    gaussian_blur: true
    random_erasing: false
    # Shot, Gaussian and ISO sensor noise, applied on the GPU by GPUAugment.
    sensor_noise: true
    shot_noise_p: 0.2
    gauss_noise_p: 0.8
    iso_noise_p: 0.6

experiment:
  name: "detector_stride4"
  output_dir: "outputs"
  seed: 42
  log_every_n_steps: 50
  # Mean landing error over every ground-truth dart, a missed dart counting
  # as match_gate_px; logged every validation epoch.
  checkpoint_monitor: "val/landing_px_error_penalised"
