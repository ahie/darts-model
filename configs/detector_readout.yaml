# Stage 3 of 3: the token readout (model/token_readout.py) on a frozen
# stage-2 model -- learned queries over the stride-4 cells that carry the tip
# heatmap's dense supervision, doing Hough's counting and the tip assignment
# in-graph.
#
#   darts-train --config configs/detector_readout.yaml
#
# Every weight but the readout's is frozen and runs without gradients, so the
# dense model cannot drift and stage 2's own readout -- Hough with tip peaks
# assigned -- is measured on exactly the same weights each epoch, as
# val/landing_px_error_penalised_centre_claim_assigned, beside plain Hough.
#
# Outputs, per stride-8 cell: a dart foreground score and that dart's oriented
# box, landing point and flight end; plus the 40 double-ring corners of the
# board. Darts are read out by Hough voting over the foreground cells.
#
# On one RTX 5090: a frozen forward plus a small readout; well under the
# detector's ~6 min per epoch.

backbone:
  backbone_widths: [96, 128, 160, 256]
  backbone_depths: [2, 2, 6, 2]
  backbone_dilate_last: false
  backbone_drop_path: 0.1
  backbone_weights: ""
  # The finished stage-2 run; init_weights loads every weight but no
  # optimiser or schedule state. Everything it loads stays frozen.
  init_weights: "outputs/detector_tips4/checkpoints/last.ckpt"
  freeze_dense: true
  backbone_freeze_epochs: 0

head:
  out_stride: 8
  head_width: 128
  head_depth: 2
  use_pan: true
  predict_ends: true
  predict_keypoints: true
  num_keypoints: 40
  kp_head_width: 64
  kp_head_depth: 2
  predict_tip_heatmap: true
  # Stride 4: the head reads the backbone's stride-4 stage, fused with the
  # neck upsampled 2x. 32 wide there costs ~1.2 GMAC.
  tip_stride: 4
  tip_head_width: 32
  tip_head_depth: 2

loss:
  focal_alpha: 2.0
  focal_gamma: 4.0
  fg_weight: 1.0
  centre_weight: 5.0
  dir_weight: 0.75
  size_weight: 0.4
  tip_weight: 5.0
  flight_weight: 2.5
  kp_weight: 1.0
  kp_offset_weight: 1.0
  kp_sigma: 2.0
  # One stride-4 cell, 4px.
  tip_sigma: 1.0
  # The offset is trained on the 3x3 cells around each tip, so a peak one
  # cell off still points at it, weighted by the heatmap target so the tip's
  # own cell keeps most of the loss.
  tip_offset_radius: 1
  tip_offset_weighting: "gaussian"
  # The readout: up to 1024 stride-4 tokens, windowed self-attention with a
  # relative-position bias, three plain learned queries.
  token_readout: true
  readout_tokens: 1024
  readout_window: 8
  readout_enc_layers: 2
  readout_dec_layers: 3
  readout_dim: 96
  readout_heads: 4
  query_count: 3
  tip_heat_weight: 1.0
  tip_offset_weight: 1.0
  # Readout: Hungarian matching on landing distance and confidence; landing,
  # estimate and flight in pixels; cross-entropies on the dart pointer's
  # mass on the matched dart's own cells and the tip pointer's on its tip's.
  query_cost_px: 0.1
  query_cost_conf: 1.0
  readout_conf_weight: 1.0
  readout_tip_weight: 0.1
  readout_estimate_weight: 0.05
  readout_flight_weight: 0.05
  readout_dart_attn_weight: 0.5
  readout_tip_attn_weight: 0.5

readout:
  vote_bin_px: 4.0
  fg_threshold: 0.5
  peak_min_votes: 8
  # Validation matches detections to darts one-to-one within this distance
  # (landing point, pixels at the input size).
  match_gate_px: 40.0
  # Only for stage 2's readout, logged alongside for comparison.
  tip_snap: false
  tip_assign: "hungarian"
  tip_assign_gate_px: 40.0
  # A query is a dart when its confidence clears this.
  query_conf_threshold: 0.5
  tip_snap_score: 0.3
  tip_snap_px: 8.0
  tip_snap_axis_px: 4.0
  tip_peak_count: 16

training:
  # Only the readout trains, from scratch.
  lr: 3.0e-4
  readout_lr_factor: 1.0
  readout_warmup_epochs: 0
  backbone_lr_factor: 0.1
  weight_decay: 0.05
  warmup_epochs: 3
  final_lr_factor: 0.01
  warmup_beta1: 0.8
  # Cosine over max_epochs; it cannot be lengthened by resuming.
  max_epochs: 60
  gradient_clip_val: 0.5
  batch_size: 16
  accumulate_grad_batches: 4
  precision: "bf16-mixed"
  num_workers: 4
  accelerator: "gpu"
  devices: 1

data:
  image_size: 1024
  # Real photographs behind the board: scripts/download_places365.py.
  bg_image_dir: "bg_images"
  # CUDA devices to render on. Empty renders on the training GPU; e.g. [1]
  # moves rendering to a second GPU.
  render_gpus: []
  epoch_length: 10000
  val_epoch_length: 1000
  # P(0, 1, 2, 3 darts)
  dart_count_weights: [0.05, 0.25, 0.30, 0.40]
  grouping_prob: 0.55
  tight_prob: 0.55
  augmentation:
    brightness_limit: 0.4
    contrast_limit: 0.4
    # albumentations HueSaturationValue on uint8, OpenCV units: hue in
    # half-degrees (30 = +-60 degrees), saturation and value on 0-255.
    hue_shift_limit: 30
    sat_shift_limit: 30
    val_shift_limit: 20
    gaussian_blur: true
    random_erasing: false
    # Shot, Gaussian and ISO sensor noise, applied on the GPU by GPUAugment.
    sensor_noise: true
    shot_noise_p: 0.2
    gauss_noise_p: 0.8
    iso_noise_p: 0.6

experiment:
  name: "detector_readout"
  output_dir: "outputs"
  seed: 42
  log_every_n_steps: 50
  # Mean landing error over every ground-truth dart, a missed dart counting
  # as match_gate_px; logged every validation epoch. On the token readout.
  checkpoint_monitor: "val/landing_px_error_penalised"
