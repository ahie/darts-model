# configs/detector_queries.yaml with richer tokens: the queries read the PAN
# neck's features alongside the dart trunk's, the 2x2 stride-4 detail under
# each cell, and the cells just outside the silhouette. Everything else is
# the same, so the two runs compare on the tokens alone.
#
#   darts-train --config configs/detector_queries_rich.yaml
#
# Starts from every weight of a finished configs/detector.yaml run; the query
# head and its token projection are the only freshly initialised parts. No
# embedding. Checkpoints rank on the query readout; the centre-bin Hough
# readout on the same weights and the matched queries' landing error
# (val/landing_px_error_gt_seeds) are logged alongside.
#
# Outputs, per stride-8 cell: a dart foreground score and that dart's oriented
# box, landing point and flight end; plus the 40 double-ring corners of the
# board. Darts are read out by Hough voting over the foreground cells.
#
# On one RTX 5090: ~6 min per epoch, about 10 hours for 100.

backbone:
  backbone_widths: [96, 128, 160, 256]
  backbone_depths: [2, 2, 6, 2]
  backbone_dilate_last: false
  backbone_drop_path: 0.1
  backbone_weights: ""
  # The finished stride-8 run; init_weights loads every weight but no
  # optimiser or schedule state.
  init_weights: "outputs/detector/checkpoints/epoch768-4.055.ckpt"
  # The new head's correction starts at zero, so its first gradients reach
  # nothing upstream; the warmup covers the rest.
  backbone_freeze_epochs: 0

head:
  out_stride: 8
  head_width: 128
  head_depth: 2
  use_pan: true
  predict_ends: true
  predict_keypoints: true
  num_keypoints: 40
  kp_head_width: 64
  kp_head_depth: 2
  query_head: true
  query_count: 3
  query_tokens: 512
  # Neck and trunk together, projected to 128; plus the 2x2 stride-4 detail
  # under each cell at 32 channels each.
  token_inputs: "neck+trunk"
  token_dim: 128
  fine_tokens: true
  fine_dim: 32
  # Attention sees one cell past the silhouette; coordinates still come only
  # from silhouette cells.
  context_radius: 1
  instance_dim: 64
  instance_heads: 4
  instance_layers: 2

loss:
  focal_alpha: 2.0
  focal_gamma: 4.0
  fg_weight: 1.0
  centre_weight: 5.0
  dir_weight: 0.75
  size_weight: 0.4
  tip_weight: 5.0
  flight_weight: 2.5
  kp_weight: 1.0
  kp_offset_weight: 1.0
  kp_sigma: 2.0
  # Sized to the converged model: its other terms sum to ~0.1, while a fresh
  # embedding's pull + push start near 2-4. At weight 1 the embedding set the
  # direction of every shared layer's update and isolated darts' landing
  # error tripled within three epochs.
  # Huber in pixels on each matched query's landing point -- the same
  # weight as configs/detector_per_dart.yaml, so the two readouts compare on
  # architecture alone.
  instance_weight: 0.01
  instance_flight_weight: 0.005
  instance_huber_px: 2.0
  query_conf_weight: 0.1
  query_centre_weight: 0.005
  query_dir_weight: 0.05
  query_size_weight: 0.05
  # Matching cost: per pixel of landing distance, and per unit confidence.
  query_cost_px: 0.1
  query_cost_conf: 1.0

readout:
  vote_bin_px: 4.0
  fg_threshold: 0.5
  peak_min_votes: 8
  # A query is a dart when its confidence clears this.
  query_conf_threshold: 0.5
  # Validation matches detections to darts one-to-one within this distance
  # (landing point, pixels at the input size).
  match_gate_px: 40.0

training:
  # A twenty-fifth of the from-scratch peak: the weights are converged, and
  # fresh Adam moments move every weight by about the learning rate per step
  # whatever its gradient. 1e-4 cost isolated darts ~1.4px within one epoch.
  lr: 2.0e-5
  # The query head starts from nothing: it trains at 10x, and for the first
  # epochs reads the dense field detached, so its early, uninformed gradients
  # cannot move the converged model.
  readout_lr_factor: 10.0
  readout_warmup_epochs: 5
  backbone_lr_factor: 0.1
  weight_decay: 0.05
  warmup_epochs: 3
  final_lr_factor: 0.01
  warmup_beta1: 0.8
  # Cosine over max_epochs; it cannot be lengthened by resuming.
  max_epochs: 100
  gradient_clip_val: 0.5
  batch_size: 16
  accumulate_grad_batches: 4
  precision: "bf16-mixed"
  num_workers: 4
  accelerator: "gpu"
  devices: 1

data:
  image_size: 1024
  # Real photographs behind the board: scripts/download_places365.py.
  bg_image_dir: "bg_images"
  # CUDA devices to render on. Empty renders on the training GPU; e.g. [1]
  # moves rendering to a second GPU.
  render_gpus: []
  epoch_length: 10000
  val_epoch_length: 1000
  # P(0, 1, 2, 3 darts)
  dart_count_weights: [0.05, 0.25, 0.30, 0.40]
  grouping_prob: 0.55
  tight_prob: 0.55
  augmentation:
    brightness_limit: 0.4
    contrast_limit: 0.4
    # albumentations HueSaturationValue on uint8, OpenCV units: hue in
    # half-degrees (30 = +-60 degrees), saturation and value on 0-255.
    hue_shift_limit: 30
    sat_shift_limit: 30
    val_shift_limit: 20
    gaussian_blur: true
    random_erasing: false
    # Shot, Gaussian and ISO sensor noise, applied on the GPU by GPUAugment.
    sensor_noise: true
    shot_noise_p: 0.2
    gauss_noise_p: 0.8
    iso_noise_p: 0.6

experiment:
  name: "detector_queries_rich"
  output_dir: "outputs"
  seed: 42
  log_every_n_steps: 50
  # Mean landing error over every ground-truth dart, a missed dart counting
  # as match_gate_px; logged every validation epoch. Measured on the
  # query readout.
  checkpoint_monitor: "val/landing_px_error_penalised"
